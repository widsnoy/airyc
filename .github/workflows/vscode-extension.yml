name: VS Code Extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/widsnoy/rust-llvm-image:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' must match vX.Y.Z"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/code/package-lock.json

      - name: Install Windows GNU toolchain
        run: |
          if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "Windows GNU toolchain already installed"
          else
            apk add --no-cache mingw-w64-binutils mingw-w64-gcc
          fi
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-dlltool --version

      - name: Install Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add x86_64-pc-windows-gnu

      - name: Install extension dependencies
        working-directory: editor/code
        run: npm ci

      - name: Package extension
        working-directory: editor/code
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm run package:vsix

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: editor/code/*.vsix
          fail_on_unmatched_files: true
          overwrite_files: true
